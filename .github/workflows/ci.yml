name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile application code
        run: python -m compileall -q backend/src scripts
      - name: Check browser JavaScript syntax
        run: node --check frontend/public/client.js && node --check frontend/public/home.js && node --check frontend/public/app.js && node --check frontend/public/admin.js
      - name: Run unit tests
        env:
          PYTHONPATH: backend/src
        run: python -m unittest discover -s backend/tests -v

  container:
    name: Build and publish immutable container
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/argus
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      image: ${{ steps.image.outputs.value }}
    steps:
      - uses: actions/checkout@v6
      - name: Authenticate to GitHub Container Registry
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
      - name: Build and publish image
        id: image
        run: |
          image="$IMAGE_NAME:${GITHUB_SHA}"
          docker build --pull \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --tag "$image" \
            --tag "$IMAGE_NAME:main" \
            .
          docker push "$image"
          docker push "$IMAGE_NAME:main"
          echo "value=$image" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy to production VM
    needs: container
    # Keep image publishing safe to enable before VM credentials are configured.
    # Set the production environment variable DEPLOY_ENABLED=true to activate SSH deploys.
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.ARGUS_PUBLIC_URL }}
    concurrency:
      group: argus-production
      cancel-in-progress: false
    env:
      DEPLOY_SHA: ${{ github.sha }}
      ARGUS_IMAGE: ${{ needs.container.outputs.image }}
      VM_HOST: ${{ secrets.VM_HOST }}
      VM_USER: ${{ secrets.VM_USER }}
      VM_SSH_PRIVATE_KEY: ${{ secrets.VM_SSH_PRIVATE_KEY }}
      VM_KNOWN_HOSTS: ${{ secrets.VM_KNOWN_HOSTS }}
      VM_PORT: ${{ vars.VM_PORT }}
      VM_DEPLOY_PATH: ${{ vars.VM_DEPLOY_PATH }}
    steps:
      - name: Configure verified SSH access
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VM_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VM_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Deploy the matching source revision and image
        run: |
          ssh -i ~/.ssh/id_ed25519 -p "${VM_PORT:-22}" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$VM_USER@$VM_HOST" \
            "DEPLOY_SHA='$DEPLOY_SHA' ARGUS_IMAGE='$ARGUS_IMAGE' DEPLOY_PATH='$VM_DEPLOY_PATH' sh -s" <<'REMOTE'
          set -eu
          : "${DEPLOY_PATH:?VM_DEPLOY_PATH must be configured as a production environment variable}"
          cd "$DEPLOY_PATH"
          git fetch --depth=1 origin main
          test "$(git rev-parse origin/main)" = "$DEPLOY_SHA"
          git checkout main
          git merge --ff-only "$DEPLOY_SHA"
          ARGUS_IMAGE="$ARGUS_IMAGE" ./scripts/deploy_production.sh
          REMOTE
