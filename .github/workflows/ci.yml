name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile application code
        run: python -m compileall -q backend/src scripts
      - name: Check browser JavaScript syntax
        run: node --check frontend/public/client.js && node --check frontend/public/home.js && node --check frontend/public/app.js && node --check frontend/public/admin.js
      - name: Run unit tests
        env:
          PYTHONPATH: backend/src
        run: python -m unittest discover -s backend/tests -v
